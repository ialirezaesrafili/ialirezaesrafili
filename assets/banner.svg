<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Alireza Esrafili — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#121A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .float { animation: float 6s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="180" cy="40" r="260" fill="url(#glowA)"/>
    <circle cx="1120" cy="300" r="280" fill="url(#glowB)"/>
    <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
  </g>

  <!-- Monogram -->
  <g transform="translate(72 96)">
    <rect width="128" height="128" rx="30" fill="url(#accent)"/>
    <rect x="3" y="3" width="122" height="122" rx="27" fill="#0B1020" fill-opacity="0.15"/>
    <text x="64" y="84" text-anchor="middle" class="sans" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">AE</text>
  </g>

  <!-- Identity -->
  <g class="sans">
    <text x="232" y="138" font-size="52" font-weight="700" fill="#F1F5F9" letter-spacing="-1">Alireza Esrafili</text>
    <text x="234" y="178" font-size="22" font-weight="600" fill="url(#accent)">Full-Stack Developer</text>
    <text x="234" y="216" font-size="17" fill="#94A3B8">Building scalable products — from interface to infrastructure.</text>
  </g>

  <!-- Code card -->
  <g class="float">
    <rect x="860" y="70" width="352" height="184" rx="16" fill="#0D1117" fill-opacity="0.85" stroke="#334155" stroke-opacity="0.8"/>
    <circle cx="884" cy="92" r="5" fill="#F87171"/>
    <circle cx="902" cy="92" r="5" fill="#FBBF24"/>
    <circle cx="920" cy="92" r="5" fill="#34D399"/>
    <g class="mono" font-size="14">
      <text x="884" y="130"><tspan fill="#818CF8">const</tspan><tspan fill="#E2E8F0"> alireza = {</tspan></text>
      <text x="904" y="154"><tspan fill="#94A3B8">role:</tspan><tspan fill="#67E8F9"> 'full-stack'</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="904" y="178"><tspan fill="#94A3B8">stack:</tspan><tspan fill="#67E8F9"> ['react', 'nest']</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="904" y="202"><tspan fill="#94A3B8">openToWork:</tspan><tspan fill="#818CF8"> true</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="884" y="226" fill="#E2E8F0">};</text>
      <rect x="906" y="214" width="8" height="16" fill="#22D3EE" class="blink"/>
    </g>
  </g>
</svg>
